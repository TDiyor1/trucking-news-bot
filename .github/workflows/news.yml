name: trucking-news
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      linkedin_test:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: trucking-news
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post new articles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LINKEDIN_CHAT_ID: ${{ secrets.TELEGRAM_LINKEDIN_CHAT_ID }}
          LINKEDIN_TEST: ${{ inputs.linkedin_test }}
        run: python bot.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json news.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add state.json news.json
            git commit -m "update seen articles"
            git push
          fi
